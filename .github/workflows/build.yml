name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le dossier Android
        run: flutter create . --project-name nomade --platforms android --org fr.webeedigital
      - run: flutter pub get
      - name: Icône et nom de l'app
        run: |
          dart run flutter_launcher_icons
          sed -i 's/android:label="nomade"/android:label="Nomade"/' android/app/src/main/AndroidManifest.xml
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E "Tours moyens" test.log | sed 's/^/::notice::/'
          grep -A14 "EXCEPTION CAUGHT" test.log | head -40 | sed 's/^/::error::/'
          grep -E "\[E\]|Expected:|Actual:|Which:|Reason:" test.log | head -20 | sed 's/^/::error::/'
          exit $status
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nomade-apk
          path: build/app/outputs/flutter-apk/app-release.apk

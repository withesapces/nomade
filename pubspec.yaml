name: nomade
description: "Nomade : un jeu de cartes à swiper façon Reigns, sur la vie en van."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/characters/
    - assets/endings/
    - assets/icons/
    - assets/home.svg
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Instrument
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
        - asset: assets/fonts/InstrumentSans-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#1C1916"
  adaptive_icon_foreground: assets/icon/icon_fg.png
